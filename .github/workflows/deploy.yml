name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a desplegar (ej. v1.0.0)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Obtener la IP de la EC2
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=todo-list-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "No hay una EC2 todo-list-app corriendo"; exit 1
          fi
          echo "EC2_IP=$IP" >> "$GITHUB_ENV"

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem

      - name: Descargar el release y reiniciar el servidor
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/to-do-list-api-${TAG}.zip"
          ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            ec2-user@"$EC2_IP" "bash -s -- '$TAG' '$URL'" <<'EOF'
          set -euo pipefail
          TAG="$1"
          URL="$2"
          curl -fsSL -o /tmp/release.zip "$URL"
          sudo dnf install -y unzip > /dev/null
          sudo rm -rf /opt/app
          sudo mkdir -p /opt/app
          sudo unzip -q /tmp/release.zip -d /opt/app
          sudo python3.11 -m pip install -q -r /opt/app/src/requirements.txt
          sudo sed -i "s/^Environment=APP_VERSION=.*/Environment=APP_VERSION=${TAG}/" /etc/systemd/system/todo.service
          sudo systemctl daemon-reload
          sudo systemctl restart todo
          EOF

      - name: Confirmar la version desplegada
        run: |
          for i in $(seq 1 12); do
            RESP=$(curl -fsS --max-time 5 "http://$EC2_IP:8000/version" || true)
            echo "Intento $i: $RESP"
            if echo "$RESP" | grep -q "\"$TAG\""; then exit 0; fi
            sleep 5
          done
          echo "La version esperada no quedo corriendo"; exit 1
