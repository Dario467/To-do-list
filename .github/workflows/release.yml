name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprimir el repositorio
        run: git archive --format=zip -o "to-do-list-api-${{ github.ref_name }}.zip" HEAD

      - name: Crear release en GitHub
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "to-do-list-api-${{ github.ref_name }}.zip" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
